name: Renode Windows limited diagnostic smoke

# This short diagnostic is additional coverage, NOT a replacement for the
# full Renode Windows tests. Only basic/proto baseline assertions and the
# complete cross-port USB routing suite run here.
on:
  push:
    branches: [main]
    paths: ['test/**', 'app/**', 'cmsis/**', 'config/**', 'core/**', 'display/**', 'hal/**', 'motion/**', 'pff/**', 'src/**', '.github/workflows/renode-windows-smoke.yml']
  pull_request:
    branches: [main]
    paths: ['test/**', 'app/**', 'cmsis/**', 'config/**', 'core/**', 'display/**', 'hal/**', 'motion/**', 'pff/**', 'src/**', '.github/workflows/renode-windows-smoke.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  limited-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        chip: [F401, F411]
    steps:
      - uses: actions/checkout@v4
        with:
          path: Teacup source with spaces
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Teacup_Firmware/renode-tools
          key: renode-windows-1.17.0-python-3.12.10-arm-14.3.rel1-make-4.4.1-3-v1
      - name: Bootstrap and exercise launcher exits, timeouts and paths
        shell: cmd
        working-directory: Teacup source with spaces/test
        run: run-renode.cmd -SelfTest
      - name: Limited basic/proto UART and USB plus complete USB routing (300s per invocation)
        shell: cmd
        working-directory: Teacup source with spaces/test
        run: run-renode.cmd -Suite Baseline -Chip ${{ matrix.chip }} -Part basic,proto -TimeoutSeconds 300
      - name: Upload diagnostic logs, monitor scripts and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Renode-Windows-limited-smoke-${{ matrix.chip }}-logs
          path: Teacup source with spaces/test/results/
          if-no-files-found: warn
