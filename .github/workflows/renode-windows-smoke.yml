name: Renode Windows limited diagnostic smoke

# This short diagnostic is additional coverage, NOT a replacement for the
# full Renode Windows tests. Only basic/proto baseline assertions and the
# complete cross-port USB routing suite run here.
on:
  push:
    branches: [main]
    paths: ['test/**', 'app/**', 'cmsis/**', 'config/**', 'core/**', 'display/**', 'hal/**', 'motion/**', 'pff/**', 'src/**', '.github/workflows/renode-windows-smoke.yml']
  pull_request:
    branches: [main]
    paths: ['test/**', 'app/**', 'cmsis/**', 'config/**', 'core/**', 'display/**', 'hal/**', 'motion/**', 'pff/**', 'src/**', '.github/workflows/renode-windows-smoke.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  limited-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        chip: [F401, F411]
    steps:
      - uses: actions/checkout@v4
        with:
          path: Teacup source with spaces
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Teacup_Firmware/renode-tools
          key: renode-windows-1.17.0-python-3.12.10-arm-14.3.rel1-make-4.4.1-3-v1
      - name: Bootstrap and exercise launcher exits, timeouts and paths
        shell: cmd
        working-directory: Teacup source with spaces/test
        run: run-renode.cmd -SelfTest
      - name: Limited basic/proto UART and USB plus complete USB routing (300s per invocation)
        shell: cmd
        working-directory: Teacup source with spaces/test
        run: run-renode.cmd -Suite Baseline -Chip ${{ matrix.chip }} -Part basic,proto -TimeoutSeconds 300
      - name: Print bounded emulator diagnostics for failed cases
        if: always()
        shell: pwsh
        working-directory: Teacup source with spaces/test
        run: |
          if (Test-Path results/summary.json) {
            $summary = Get-Content results/summary.json -Raw | ConvertFrom-Json
            foreach ($case in $summary) {
              if ($case.exit_code -ne 0) {
                Write-Host "Failed case: $($case.case), exit $($case.exit_code)"
                $log = Join-Path (Join-Path results $case.case) renode.log
                if (Test-Path $log) {
                  Write-Host "--- renode.log first 25 lines ---"
                  Get-Content -LiteralPath $log -TotalCount 25
                  Write-Host "--- renode.log last 60 lines ---"
                  Get-Content -LiteralPath $log -Tail 60
                }
              }
            }
          } else {
            Write-Host "No summary yet; printing available emulator log tails."
            Get-ChildItem results -Filter renode.log -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "--- $($_.FullName) ---"
              Get-Content -LiteralPath $_.FullName -Tail 60
            }
          }
      - name: Upload diagnostic logs, monitor scripts and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Renode-Windows-limited-smoke-${{ matrix.chip }}-logs
          path: Teacup source with spaces/test/results/
          if-no-files-found: warn
