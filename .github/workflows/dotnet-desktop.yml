name: Teacup Host CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teacup-host-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.configuration }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      SOLUTION_PATH: host/TeacupHost.sln
      TEST_PROJECT_PATH: host/TeacupHost.Core.Tests/TeacupHost.Core.Tests.csproj
      APP_PROJECT_PATH: host/TeacupHost/TeacupHost.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore "$env:SOLUTION_PATH"

      - name: Build solution
        run: dotnet build "$env:SOLUTION_PATH" --configuration ${{ matrix.configuration }} --no-restore

      - name: Run core tests
        run: >-
          dotnet test "$env:TEST_PROJECT_PATH"
          --configuration ${{ matrix.configuration }}
          --no-build --no-restore
          --logger "trx;LogFileName=TeacupHost-${{ matrix.configuration }}.trx"
          --results-directory TestResults

      # Every iteration must pass: this catches timing regressions, not retries
      # that hide a failed run. Keep the regular full test suite above intact.
      - name: Repeat Telnet reconnect regression (10 runs)
        shell: pwsh
        run: |
          for ($iteration = 1; $iteration -le 10; $iteration++) {
            Write-Host "Telnet reconnect regression $iteration / 10"
            dotnet test "$env:TEST_PROJECT_PATH" `
              --configuration ${{ matrix.configuration }} `
              --no-build --no-restore `
              --filter "FullyQualifiedName=TeacupHost.Core.Tests.TelnetTests.PrintsOverTelnetAndReconnectsAfterDrop" `
              --logger "trx;LogFileName=Telnet-${{ matrix.configuration }}-$iteration.trx" `
              --results-directory TestResults
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TeacupHost-test-results-${{ matrix.configuration }}
          path: TestResults/*.trx
          if-no-files-found: warn

      # Portable Windows application; no MSIX project or signing certificate is required.
      - name: Publish Windows x64 application
        run: >-
          dotnet publish "$env:APP_PROJECT_PATH"
          --configuration ${{ matrix.configuration }}
          --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output artifacts/TeacupHost-win-x64-${{ matrix.configuration }}

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: TeacupHost-win-x64-${{ matrix.configuration }}
          path: artifacts/TeacupHost-win-x64-${{ matrix.configuration }}/
          if-no-files-found: error
